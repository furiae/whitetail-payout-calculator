<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Whitetail Payout Calculator</title>
    <link rel="stylesheet" href="turkeyCalcV2.css">
</head>
<body>
    <h1>APEX Whitetail Challenge<br>
    Payout Calculator</h1>

    <div class="payout-info-container">
        <div class="payout-info">
            <table id="payout-nums">
                <thead>
                    <tr>
                        <th>Hunter Entries</th>
                        <th>Payout Model</th>
                    </tr>
                    <tr>
                        <td>2,500</td>
                        <td>2,500</td>
                    </tr>
                    <tr>
                        <th>Gross Revenue</th>
                        <th>Hunter Payout</th>
                    </tr>
                    <tr>
                        <td>$562,500</td>
                        <td>$365,650</td>
                    </tr>
                </thead>
            </table>

            <h3>Gross Margin</h3>
            <h4 id="gross-margin">$196,850 (35%)</h4>
        </div>
    </div>

    <div class="controls">
        <form id="hunter-entries" action="submit">
            <label for="hunter-entries-input">HUNTER ENTRIES</label>
            <input type="text" inputmode="numeric" placeholder="2500" id="hunter-entries-input">
            <button>Submit</button>
        </form>

        <form id="entry-fee" action="submit">
            <label for="entry-fee-input">ENTRY FEE</label>
            <input type="text" inputmode="numeric" placeholder="225" id="entry-fee-input">
            <button>Submit</button>
        </form>
    </div>

    <p id="input-error" class="input-error" role="status" aria-live="polite"></p>

    <div class="row-container">
        <div id="row">
            <div class="leaderboard">
                <p class="leaderboard-heading">TOP TEN</p>
                <table class="leaderboard-table" id="top-ten">
                    <thead>
                        <tr>
                            <th>Place</th>
                            <th>Payout</th>
                        </tr>
                    </thead>
                    <!-- Rows are rendered by whitetailCalcV4.js -->
                    <tbody></tbody>
                </table>
            </div>

            <div class="leaderboard">
                <p class="leaderboard-heading">OUTSIDE TOP 10</p>
                <table class="leaderboard-table" id="outside-top-ten">
                    <thead>
                        <tr>
                            <th>Place</th>
                            <th>Payout</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="leaderboard">
                <p class="leaderboard-heading">SPECIAL HARVEST</p>
                <table class="leaderboard-table" id="special-harvest">
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Payout</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="payoutConfig.js"></script>
    <script src="whitetailCalcV4.js"></script>
</body>
</html>
